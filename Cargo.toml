[package]
name = "vantalauncher"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "1.14.1"
directories = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"


[build-dependencies]
slint-build = "1.14.1"

[profile.release]
codegen-units = 1
lto = true
